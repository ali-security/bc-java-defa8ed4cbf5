language: java
dist: jammy

# Upstream's config was only `jdk: openjdk8` with Travis' default `./gradlew assemble` / `./gradlew check`,
# which cannot configure this build: build.gradle throws unless BC_JDK8/11/17/21 point at JDK homes
# (toolchains, auto-detect off), and Gradle 8.5 + the JDK 17/21 compile toolchains need JDK 17 to run
# (as upstream's ci/test_*.sh do). Tests launch on the JDK each task's toolchain names (test = JDK 8,
# test11/test17/test21 = that JDK). The suite is split into jobs to stay inside Travis' 50-minute job limit.
env:
  global:
    - BC_JDK8=$HOME/jdk8u402-b06
    - BC_JDK11=$HOME/jdk-11.0.22+7
    - BC_JDK17=$HOME/jdk-17.0.10+7
    - BC_JDK21=$HOME/jdk-21.0.2+13
  jobs:
    - SEAL_LEG=core TEST_TASKS=":prov:jar :core:test -PexcludeTests=org.bouncycastle.pqc.*"
    # pqc.crypto.test.AllTests is one sequential JUnit suite (~20 min before its long GeMSSTest starts), so it gets a job of its own;
    # the other pqc suites run in a second job.
    - SEAL_LEG=core-pqc-crypto TEST_TASKS=":core:test --tests org.bouncycastle.pqc.crypto.test.AllTests"
    - SEAL_LEG=core-pqc-other TEST_TASKS=":core:test --tests org.bouncycastle.pqc.* -PexcludeTests=org.bouncycastle.pqc.crypto.test.AllTests"
    - SEAL_LEG=prov TEST_TASKS=":prov:test"
    - SEAL_LEG=prov-jdk11 TEST_TASKS=":prov:test11"
    - SEAL_LEG=prov-jdk17 TEST_TASKS=":prov:test17"
    - SEAL_LEG=prov-jdk21 TEST_TASKS=":prov:test21"
    - SEAL_LEG=pkix-tls-pg TEST_TASKS=":pkix:test :tls:test :pg:test"

before_install:
  - date +%s > $HOME/.seal-job-start
  - curl -fsSL https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u402-b06/OpenJDK8U-jdk_x64_linux_hotspot_8u402b06.tar.gz | tar xz -C $HOME
  - curl -fsSL https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.22%2B7/OpenJDK11U-jdk_x64_linux_hotspot_11.0.22_7.tar.gz | tar xz -C $HOME
  - curl -fsSL https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jdk_x64_linux_hotspot_17.0.10_7.tar.gz | tar xz -C $HOME
  - curl -fsSL https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jdk_x64_linux_hotspot_21.0.2_13.tar.gz | tar xz -C $HOME
  - curl -fsSL https://codeload.github.com/bcgit/bc-test-data/tar.gz/refs/tags/r1rv78 | tar xz -C $TRAVIS_BUILD_DIR/..
  - mv $TRAVIS_BUILD_DIR/../bc-test-data-r1rv78 $TRAVIS_BUILD_DIR/../bc-test-data
  # CVE-2025-8916 CheckNameConstraintsTest loads mal-root/ca1/ca2/leaf.crt, which r1rv78 lacks; pinned from bc-test-data main @ eef6986a.
  - mkdir -p $TRAVIS_BUILD_DIR/../bc-test-data/pkix
  - for c in mal-root mal-ca1 mal-ca2 mal-leaf; do curl -fsSL --retry 3 -o $TRAVIS_BUILD_DIR/../bc-test-data/pkix/$c.crt https://raw.githubusercontent.com/bcgit/bc-test-data/eef6986af224159d2b6c6a0234dde10c5db28794/pkix/$c.crt; done
  - export JAVA_HOME=$BC_JDK17
  - export PATH=$JAVA_HOME/bin:$PATH
  - export JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF8
  - java -version

install: true

script:
  # Timestamped keepalive: single long tests (GeMSSTest) print nothing for >10 min, which trips Travis' no-output watchdog.
  - (while sleep 240; do echo "[seal keepalive] $(date -u +%H:%M:%S)"; done) &
  - ./gradlew --no-daemon --console=plain -s --init-script ci/seal-init.gradle $TEST_TASKS

after_script:
  - sh .travis/wait-for-log.sh "$SEAL_LEG"
